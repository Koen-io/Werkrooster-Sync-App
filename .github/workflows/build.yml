name: Test & build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  build-macos:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .app
        run: |
          pip install -r requirements-dev.txt
          pyinstaller WerkroosterSync.spec --noconfirm --workpath .pyibuild
          codesign --force --deep -s - "dist/Werkrooster Sync.app"
          ditto -c -k --keepParent "dist/Werkrooster Sync.app" "WerkroosterSync-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WerkroosterSync-macOS
          path: WerkroosterSync-macOS.zip

  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .exe
        run: |
          pip install -r requirements-dev.txt
          pyinstaller WerkroosterSync.spec --noconfirm --workpath .pyibuild
      - uses: actions/upload-artifact@v4
        with:
          name: WerkroosterSync-Windows
          path: dist/WerkroosterSync.exe
