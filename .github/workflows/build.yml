name: Test & build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publiceer een release met deze tag (bijv. v1.0.0); leeg = alleen bouwen"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  build-macos:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "__version__ = \"${TAG#v}\"" > werkrooster_sync/version.py
      - name: Build .app
        run: |
          pip install -r requirements-dev.txt
          pyinstaller WerkroosterSync.spec --noconfirm --workpath .pyibuild
          codesign --force --deep -s - "dist/Werkrooster Sync.app"
          ditto -c -k --keepParent "dist/Werkrooster Sync.app" "WerkroosterSync-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WerkroosterSync-macOS
          path: WerkroosterSync-macOS.zip

  build-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "__version__ = \"${TAG#v}\"" > werkrooster_sync/version.py
      - name: Build .exe
        run: |
          pip install -r requirements-dev.txt
          pyinstaller WerkroosterSync.spec --noconfirm --workpath .pyibuild
      - uses: actions/upload-artifact@v4
        with:
          name: WerkroosterSync-Windows
          path: dist/WerkroosterSync.exe

  release:
    needs: [build-macos, build-windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          # Extract the section for this tag from CHANGELOG.md (the lines
          # under "## <tag>" up to the next "## "). This becomes the release
          # body shown in the in-app update popup — the "what's new" notes.
          NOTES=$(awk -v tag="## ${TAG}" '
            $0==tag {grab=1; next}
            /^## / {grab=0}
            grab {print}
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES="Nieuwe versie van Werkrooster Sync."
          fi
          {
            echo "### Wat is er nieuw in ${TAG}"
            echo ""
            echo "$NOTES"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Publish release with both apps
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Werkrooster Sync ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/WerkroosterSync-macOS/WerkroosterSync-macOS.zip
            artifacts/WerkroosterSync-Windows/WerkroosterSync.exe
