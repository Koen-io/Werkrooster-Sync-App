name: Proefbouw Mac Intel (oudere Macs)

# Proef: een losse Mac-versie voor Intel-Macs vanaf macOS 12 (Monterey).
# Publiceert niets; het resultaat staat alleen als download bij de run.
on:
  push:
    branches: [claude/mac-ouder-proefbouw]
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    env:
      # Qt 6.8 (LTS) is de laatste reeks die macOS 12 ondersteunt.
      PYSIDE_LEGACY: "6.8.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (oudere PySide6)
        run: |
          pip install -r requirements-dev.txt
          pip install "PySide6==$PYSIDE_LEGACY"
          python -c "import PySide6, platform; print(PySide6.__version__, platform.machine())"
      - name: Run tests met de oudere PySide6
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q
      - name: Stamp proefversie
        run: echo '__version__ = "0.0.0-proef-intel"' > werkrooster_sync/version.py
      - name: Build .app
        run: |
          pyinstaller WerkroosterSync.spec --noconfirm --workpath .pyibuild
          codesign --force --deep -s - "dist/Werkrooster Sync.app"
          ditto -c -k --keepParent "dist/Werkrooster Sync.app" "WerkroosterSync-macOS-Intel.zip"
      - name: Controle - processor en minimale macOS-versie
        run: |
          APP="dist/Werkrooster Sync.app/Contents"
          lipo -info "$APP/MacOS/WerkroosterSync"
          find "$APP" -type f | while read -r f; do
            file -b "$f" | grep -q Mach-O || continue
            echo "$(otool -l "$f" | awk '/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; exit}') $(lipo -archs "$f")"
          done | sort -V | uniq -c
          NEWEST=$(find "$APP" -type f | while read -r f; do
            file -b "$f" | grep -q Mach-O && otool -l "$f" | awk '/minos/{print $2; exit}'
          done | sort -V | tail -1)
          echo "Hoogste minimale macOS-versie in de app: $NEWEST"
          [ "$(printf '%s\n12.0\n' "$NEWEST" | sort -V | tail -1)" = "12.0" ] || { echo "Te nieuw voor Monterey"; exit 1; }
      - name: Controle - app start en blijft draaien
        run: |
          QT_QPA_PLATFORM=offscreen "dist/Werkrooster Sync.app/Contents/MacOS/WerkroosterSync" &
          PID=$!
          sleep 15
          kill -0 $PID && echo "App draait na 15 s" && kill $PID
      - uses: actions/upload-artifact@v4
        with:
          name: WerkroosterSync-macOS-Intel
          path: WerkroosterSync-macOS-Intel.zip
